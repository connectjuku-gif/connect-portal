<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小学算数_分数の約分ドリル（ランダム）</title>
<style>
@page { size: A4; margin: 14mm 14mm; }
* { box-sizing: border-box; }
body { font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", "Meiryo", "Noto Sans JP", sans-serif; color:#111; line-height:1.6; font-size:11.5pt; margin:0; background:#e9e9e9; }
.sheet { background:#fff; max-width: 190mm; margin: 12px auto; padding: 12mm 12mm; box-shadow: 0 1px 6px rgba(0,0,0,.15); }
@media print { body{background:#fff;} .sheet{ box-shadow:none; margin:0; padding:0; max-width:none; } .nop{display:none !important;} .pb{ page-break-before: always; break-before: page; } }

/* ---- 操作バー ---- */
.controlbar { position: sticky; top: 0; z-index: 10; background: #1F3A5F; color: #fff; padding: 12px 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; font-size: 13px; }
.controlbar .title { font-weight: bold; font-size: 15px; margin-right: 8px; }
.controlbar button { font-family: inherit; font-size: 13px; padding: 7px 14px; border-radius: 6px; border: none; cursor: pointer; }
.controlbar button.primary { background: #C9972B; color: #fff; font-weight: bold; }
.controlbar button.secondary { background: #3A557A; color: #fff; }
.controlbar button.secondary.active { background: #8A2E2E; }
.controlbar select { font-family:inherit; font-size:13px; padding:6px 8px; border-radius:6px; border:none; }
.controlbar label { display:inline-flex; align-items:center; gap:6px; }
.controlbar .spacer { flex: 1; }
.controlbar .count { font-size: 12px; color: #D9E1EC; }
body.editmode [contenteditable="true"] { outline: 1px dashed #C9972B; }
@media print { [contenteditable] { outline: none !important; } }

/* ---- 問題用紙 ---- */
.hh { border-bottom:2px solid #222; padding-bottom:3px; margin-bottom:6px; }
.hh1 { font-size:10.5pt; color:#333; letter-spacing:.05em; display:flex; justify-content:space-between; }
.hh2 { font-size:15pt; font-weight:bold; margin-top:1px; }
.meta { display:flex; align-items:flex-end; justify-content:flex-end; gap:6px; font-size:10.5pt; margin:4px 0 6px; }
.meta .ln { display:inline-block; border-bottom:1px solid #222; }
.meta .w1 { min-width:42mm; } .meta .w2 { min-width:24mm; } .meta .w3 { min-width:12mm; }
.point { border:1px solid #222; padding:5px 10px; font-size:10pt; line-height:1.55; margin-bottom:4mm; }
.grid { display:grid; grid-template-columns: 1fr 1fr; column-gap:14mm; }
.cell { height: 22mm; display:flex; align-items:center; gap:6px; border-bottom:1px dotted #888; font-size:14pt; }
.no { font-size:10.5pt; font-weight:bold; width:2.4em; flex-shrink:0; }
.cell .eq { margin: 0 4px; }
.cell .box { display:inline-block; width:24mm; height:15mm; border:1px solid #555; margin-left:4px; }
.fr { display:inline-flex; flex-direction:column; text-align:center; vertical-align:middle; line-height:1.3; font-weight:bold; }
.fr > span:first-child { border-bottom:1.5px solid #111; padding:0 5px; }
.fr > span:last-child { padding:0 5px; }

/* ---- 白紙・解答 ---- */
.blankpage { text-align:center; color:#aaa; font-size:10px; padding-top:120mm; height:250mm; }
.ans h1 { text-align:center; font-size:16pt; margin:0 0 4px; }
.ans .sub { text-align:center; font-size:10.5pt; color:#444; margin-bottom:8px; }
.ans h2 { font-size:12pt; border-left:5px solid #222; padding-left:8px; margin:10px 0 4px; break-after:avoid; }
.agrid { display:grid; grid-template-columns: repeat(5, 1fr); gap: 2px 8px; break-inside:avoid; }
.ai { font-size:11pt; padding:3px 0; border-bottom:1px dotted #bbb; display:flex; align-items:center; gap:4px; }
.ai .no { width:2.2em; font-size:9.5pt; }
.ai .fr { font-size:10.5pt; }
.k { font-weight:bold; text-decoration: underline; }
.memo { border:2px solid #222; padding:8px 12px; font-size:10pt; margin:8px 0; }
.memo b { display:block; margin-bottom:2px; }
</style>
</head>
<body>

<div class="controlbar nop">
  <span class="title">🔢 分数の約分ドリル｜学習塾CONNECT</span>
  <label>問題 <select id="modeSel"><option value="all">約分できる問題だけ</option><option value="mixed">これ以上約分できない問題もまぜる</option></select></label>
  <label>枚数 <select id="countSel"><option value="1">1枚（20問）</option><option value="2" selected>2枚（40問）</option><option value="3">3枚（60問）</option><option value="4">4枚（80問）</option><option value="5">5枚（100問）</option><option value="6">6枚（120問）</option></select></label>
  <button class="primary" id="genBtn">問題を作り直す</button>
  <button class="secondary" id="editBtn">編集モード</button>
  <button class="secondary" id="printBtn">印刷</button>
  <span class="spacer"></span>
  <span class="count" id="info"></span>
</div>

<div id="output"></div>

<script>
(function(){
  function ri(min, max){ return Math.floor(Math.random()*(max-min+1))+min; }
  function gcd(a, b){ while(b){ var t = a % b; a = b; b = t; } return a; }
  function fr(n, d){ return '<span class="fr"><span>'+n+'</span><span>'+d+'</span></span>'; }
  function ans(n, d){ var g = gcd(n, d), a = n/g, b = d/g; return b === 1 ? String(a) : fr(a, b); }

  // 1枚分（20問）。同じ分数が1枚の中で重ならないようにする
  function makeSheet(mode){
    var list = [], seen = {}, nonReducible = 0;
    while (list.length < 20) {
      var d = ri(4, 30), n = ri(1, d - 1), g = gcd(n, d);
      if (seen[n+'/'+d]) continue;
      if (mode === 'all' && g === 1) continue;
      if (mode === 'mixed' && g === 1) { if (nonReducible >= 5) continue; nonReducible++; }   // まぜるときも約分できない問題は1枚5問まで
      seen[n+'/'+d] = 1; list.push([n, d]);
    }
    return list;
  }
  var sheets = [];

  function sheetHtml(list, k, total){
    var h = '<div class="sheet'+(k ? ' pb' : '')+'"><div class="hh"><div class="hh1"><span>小学算数　分数</span><span>'+(total > 1 ? (k+1)+'／'+total+'枚目' : '')+'</span></div>'
      + '<div class="hh2">分数の約分ドリル</div></div>'
      + '<div class="meta"><span>名前</span><span class="ln w1"></span><span>　月　日</span><span>　</span><span class="ln w3"></span><span>／20問</span></div>'
      + '<div class="point">次の分数を約分しましょう。分母と分子を、同じ数（できるだけ大きい数＝最大公約数）でわります。'
      + '<br>これ以上約分できないときは、そのまま書きましょう。わりきれて分母が1になるときは、整数で書きます。</div><div class="grid">';
    list.forEach(function(p, i){
      h += '<div class="cell"><span class="no">('+(i+1)+')</span>'+fr(p[0], p[1])+'<span class="eq">＝</span><span class="box"></span></div>';
    });
    return h + '</div></div>';
  }
  function answerHtml(){
    var h = '<div class="sheet ans pb"><h1>解答</h1><div class="sub">分数の約分ドリル（'+sheets.length+'枚・全'+(sheets.length*20)+'問）</div>';
    sheets.forEach(function(list, k){
      if (sheets.length > 1) h += '<h2>'+(k+1)+'枚目</h2>';
      h += '<div class="agrid">';
      list.forEach(function(p, i){ h += '<div class="ai"><span class="no">('+(i+1)+')</span><span class="k">'+ans(p[0], p[1])+'</span></div>'; });
      h += '</div>';
    });
    h += '<div class="memo"><b>■ 約分のポイント</b>・分母と分子を、両方をわりきれる数でわる。一度で最大公約数でわれば1回で終わる。<br>'
      + '・2や3で何回かに分けてわってもよい。最後に「これ以上われないか」を必ず確かめよう。</div></div>';
    return h;
  }
  function render(){
    var n = +document.getElementById('countSel').value, mode = document.getElementById('modeSel').value;
    sheets = []; for (var k = 0; k < n; k++) sheets.push(makeSheet(mode));
    var h = sheets.map(function(l, k){ return sheetHtml(l, k, n); }).join('');
    // 両面印刷用：問題が3枚以上の奇数枚なら白紙を1枚はさみ、解答を新しい紙の表から始める
    if (n > 1 && n % 2 === 1) h += '<div class="sheet pb blankpage">（両面印刷用の白紙ページ）</div>';
    document.getElementById('output').innerHTML = h + answerHtml();
    document.getElementById('info').textContent = '問題 '+n+'枚（'+(n*20)+'問）＋解答';
    if (document.body.classList.contains('editmode')) setEdit(true);
  }
  function setEdit(on){
    document.body.classList.toggle('editmode', on);
    var b = document.getElementById('editBtn'); b.classList.toggle('active', on); b.textContent = on ? '編集モード：ON' : '編集モード';
    Array.prototype.forEach.call(document.querySelectorAll('#output .sheet'), function(s){ s.contentEditable = on ? 'true' : 'false'; });
  }
  document.getElementById('genBtn').addEventListener('click', render);
  document.getElementById('modeSel').addEventListener('change', render);
  document.getElementById('countSel').addEventListener('change', render);
  document.getElementById('editBtn').addEventListener('click', function(){ setEdit(!document.body.classList.contains('editmode')); });
  document.getElementById('printBtn').addEventListener('click', function(){ window.print(); });
  render();
})();
</script>
</body>
</html>
