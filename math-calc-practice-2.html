<body>

<div class="controlbar nop">
  <span class="title">🔢 中2数学 計算練習（式の計算・連立方程式）｜学習塾CONNECT</span>
  <button class="primary" id="genBtn">問題を作り直す</button>
  <button class="secondary" id="editBtn">編集モード</button>
  <button class="secondary" id="printBtn">印刷</button>
  <span class="spacer"></span>
  <span class="count" id="rangeInfo">STEP1〜6　計69問（各12問×5＋9問×1）</span>
</div>

<div id="output"></div>

<script>
(function(){
  // ---------- helpers ----------
  function ri(min, max){ return Math.floor(Math.random()*(max-min+1))+min; }
  function rnz(min, max){ var v; do{ v = ri(min,max); }while(v===0); return v; }
  function rs(){ return Math.random()<0.5 ? -1 : 1; }
  function gcd(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){ var t=a%b; a=b; b=t; } return a||1; }
  function lcm(a,b){ return Math.abs(a*b)/gcd(a,b); }
  function signed(v){ return v<0 ? ('−'+Math.abs(v)) : String(v); }
  function dvar(v){ return '<i>'+v+'</i>'; }
  function fa(n,d){ return '<span class="fr"><span>'+n+'</span><span>'+d+'</span></span>'; }
  function vr(pool){ return pool[ri(0, pool.length-1)]; }
  // retry wrapper: generator returns null when the random values are unsuitable
  function G(f){ return function(){ for(var i=0;i<500;i++){ var r=f(); if(r) return r; } throw new Error('gen failed'); }; }

  // ---------- rational numbers [n,d] ----------
  function Q(n,d){ if(d===undefined) d=1; if(d<0){ n=-n; d=-d; } var g=gcd(n,d); return [n/g, d/g]; }
  function qa(a,b){ return Q(a[0]*b[1]+b[0]*a[1], a[1]*b[1]); }
  function qm(a,b){ return Q(a[0]*b[0], a[1]*b[1]); }
  function qd(a,b){ return Q(a[0]*b[1], a[1]*b[0]); }
  function qn(a){ return [-a[0], a[1]]; }
  function qz(a){ return a[0]===0; }
  function qStr(a){ if(a[1]===1) return signed(a[0]); return (a[0]<0?'−':'')+fa(Math.abs(a[0]), a[1]); }

  // ---------- monomials {c:[n,d], v:{x:1,...}} and polynomials (arrays) ----------
  var ORDER = 'abcmhSVxyℓ';
  function parseV(s){ var v={}, re=/([^\d])(\d*)/g, m; while((m=re.exec(s))){ v[m[1]]=(v[m[1]]||0)+(m[2]?parseInt(m[2],10):1); } return v; }
  function M(c, vs){ return {c: (typeof c==='number') ? Q(c) : Q(c[0],c[1]), v: parseV(vs||'')}; }
  function vkeys(v){ return Object.keys(v).filter(function(k){return v[k]>0;}).sort(function(a,b){ return ORDER.indexOf(a)-ORDER.indexOf(b); }); }
  function vKey(v){ return vkeys(v).map(function(k){ return k+v[k]; }).join(''); }
  function vStr(v){ return vkeys(v).map(function(k){ return dvar(k)+(v[k]>1?'<sup>'+v[k]+'</sup>':''); }).join(''); }
  function body(m){ // coefficient (absolute) + variables
    var n=Math.abs(m.c[0]), d=m.c[1], vs=vStr(m.v);
    if (vs && n===1 && d===1) return vs;
    if (d===1) return n+vs;
    return fa(n,d)+vs;
  }
  function P(list){ // polynomial to html
    var L = list.filter(function(m){ return !qz(m.c); });
    if (!L.length) return '0';
    return L.map(function(m,i){
      var neg = m.c[0]<0;
      if (i===0) return (neg?'−':'')+body(m);
      return (neg?' − ':' + ')+body(m);
    }).join('');
  }
  function F(m){ var s=P([m]); return m.c[0]<0 ? '('+s+')' : s; } // monomial as a factor
  function PP(list){ return '('+P(list)+')'; }
  function merge(list){
    var keys=[], map={};
    list.forEach(function(m){ var k=vKey(m.v); if(!(k in map)){ keys.push(k); map[k]={c:Q(0), v:m.v}; } map[k].c = qa(map[k].c, m.c); });
    return keys.map(function(k){ return map[k]; }).filter(function(m){ return !qz(m.c); });
  }
  function scale(list, k){ var kk = (typeof k==='number')?Q(k):k; return list.map(function(m){ return {c:qm(m.c,kk), v:m.v}; }); }
  function mmul(a,b){ var v={}, k; for(k in a.v) v[k]=(v[k]||0)+a.v[k]; for(k in b.v) v[k]=(v[k]||0)+b.v[k]; return {c:qm(a.c,b.c), v:v}; }
  function mdiv(a,b){ var v={}, k; for(k in a.v) v[k]=(v[k]||0)+a.v[k]; for(k in b.v) v[k]=(v[k]||0)-b.v[k]; return {c:qd(a.c,b.c), v:v}; }
  function kStr(k){ return k===1 ? '' : (k===-1 ? '−' : signed(k)); } // coefficient in front of ( )

  // ---------- simultaneous equations ----------
  function eq(a,b,c){ return P([M(a,'x'),M(b,'y')])+' = '+signed(c); }
  function sys(e1, e2){ return '<span class="sys"><span class="br">{</span><span class="eqs"><span>'+e1+'</span><span>'+e2+'</span></span></span>'; }
  function xy(x,y){ return dvar('x')+' = '+signed(x)+'、'+dvar('y')+' = '+signed(y); }
  function sol(){ return [rnz(-6,6), rnz(-6,6)]; }
  function dFmt(t){ var s=t<0?'−':'', v=Math.abs(t); return v%10===0 ? s+(v/10) : s+Math.floor(v/10)+'.'+(v%10); }
  function decEq(at, bt, ct){ // coefficients in tenths
    function term(t, vname, first){
      var sg = t<0 ? (first?'−':' − ') : (first?'':' + ');
      var a = Math.abs(t);
      return sg + (a===10 ? '' : dFmt(a)) + dvar(vname);
    }
    return term(at,'x',true)+term(bt,'y',false)+' = '+dFmt(ct);
  }

  // ========== STEP 1: 式の加法・減法 ==========
  function likeTerms(vars){ return G(function(){
    var cs = [ri(1,9), rnz(-9,9), rnz(-9,9), rnz(-9,9)];
    var L = vars.map(function(v,i){ return M(cs[i], v); });
    var R = merge(L); if (R.length<2) return null;
    return {ex: P(L), ans: P(R)};
  }); }
  var s1a1 = likeTerms(['x','y','x','y']);
  var s1a2 = likeTerms(['x2','x','x2','x']);
  var s1a3 = likeTerms(['xy','x','x','xy']);
  var s1a4 = likeTerms(['a','','a','']);

  var s1b1 = G(function(){
    var P1=[M(ri(1,6),'x'), M(rnz(-7,7),'y')], P2=[M(ri(1,6),'x'), M(rnz(-7,7),'y')];
    var R=merge(P1.concat(P2)); if(R.length<2) return null;
    return {ex: PP(P1)+' + '+PP(P2), ans: P(R)}; });
  var s1b2 = G(function(){
    var P1=[M(ri(1,7),'x'), M(rnz(-7,7),'y')], P2=[M(ri(1,6),'x'), M(rnz(-7,7),'y')];
    var E=P1.concat(scale(P2,-1)), R=merge(E); if(R.length<2) return null;
    return {ex: PP(P1)+' − '+PP(P2), ans: P(R), step:'途中：'+P(E)}; });
  var s1b3 = G(function(){
    var P1=[M(ri(1,3),'x2'), M(rnz(-7,7),'x'), M(rnz(-9,9),'')], P2=[M(ri(1,4),'x2'), M(rnz(-7,7),'x'), M(rnz(-9,9),'')];
    var E=P1.concat(scale(P2,-1)), R=merge(E); if(R.length<3) return null;
    return {ex: PP(P1)+' − '+PP(P2), ans: P(R), step:'途中：'+P(E)}; });
  var s1b4 = G(function(){ // 縦書き
    var P1=[M(ri(2,9),'a'), M(rnz(-9,9),'b'), M(rnz(-9,9),'')], P2=[M(ri(1,9),'a'), M(rnz(-9,9),'b'), M(rnz(-9,9),'')];
    var plus = Math.random()<0.5;
    var R = merge(P1.concat(plus?P2:scale(P2,-1))); if(R.length<3) return null;
    var ex = '<span class="vt"><span>'+P(P1)+'</span><span class="vt2">'+(plus?'+)':'−)')+'　'+P(P2)+'</span></span>';
    return {ex: ex, ans: P(R)}; });

  var s1c1 = G(function(){ var k=ri(2,6), L=[M(ri(1,6),'x'), M(rnz(-7,7),'y')];
    return {ex: k+PP(L), ans: P(scale(L,k))}; });
  var s1c2 = G(function(){ var k=-ri(2,6), L=[M(ri(1,6),'x'), M(rnz(-7,7),'y'), M(rnz(-9,9),'')];
    return {ex: kStr(k)+PP(L), ans: P(scale(L,k)), step:'途中：かっこの前が − なので、かっこの中の符号がすべて変わる'}; });
  var s1c3 = G(function(){ var k=ri(2,6), L=[M(k*ri(1,5),'x'), M(k*rnz(-5,5),'y')];
    return {ex: PP(L)+' ÷ '+k, ans: P(scale(L,Q(1,k))), step:'途中：'+fa(P(L),k)}; });
  var s1c4 = G(function(){ var k=-ri(2,5), L=[M(-k*ri(1,5),'x'), M(-k*rnz(-5,5),'y')];
    return {ex: PP(L)+' ÷ ('+signed(k)+')', ans: P(scale(L,Q(1,k)))}; });

  // ========== STEP 2: 単項式の乗法・除法 ==========
  var s2a1 = G(function(){ var a=M(ri(2,9)*rs(),'x'), b=M(ri(2,9)*rs(),'y');
    return {ex: P([a])+' × '+F(b), ans: P([mmul(a,b)])}; });
  var s2a2 = G(function(){ var a=M(ri(2,6)*rs(),'x'), b=M(ri(2,6)*rs(),'xy');
    return {ex: P([a])+' × '+F(b), ans: P([mmul(a,b)])}; });
  var s2a3 = G(function(){ var a=M(-ri(2,6), vr(['x','a','y'])), sq=mmul(a,a);
    return {ex: '('+P([a])+')<sup>2</sup>', ans: P([sq]), step:'途中：'+F(a)+' × '+F(a)}; });
  var s2a4 = G(function(){ var a=M(-ri(2,4),'x'), b=M(ri(2,5)*rs(),'y'), sq=mmul(a,a);
    return {ex: '('+P([a])+')<sup>2</sup> × '+F(b), ans: P([mmul(sq,b)]), step:'途中：'+P([sq])+' × '+F(b)}; });

  var s2b1 = G(function(){ var a=ri(2,6)*rs(), b=ri(2,6)*rs(); var dd=M(a*b,'xy'), dv=M(a,'x');
    return {ex: P([dd])+' ÷ '+F(dv), ans: P([mdiv(dd,dv)]), step:'途中：'+(a*b<0?'−':'')+fa(body(dd), body(dv))+'（符号を先に決める）'}; });
  var s2b2 = G(function(){ var d=ri(2,6)*rs(), k=ri(2,6)*rs(); var dd=M(d*k,'a2b'), dv=M(d,'ab');
    return {ex: P([dd])+' ÷ '+F(dv), ans: P([mdiv(dd,dv)])}; });
  var s2b3 = G(function(){ var c=ri(2,12), d=ri(2,9); if(c%d===0 || d%c===0) return null; c*=rs();
    var dd=M(c,'xy'), dv=M(d,'x');
    return {ex: P([dd])+' ÷ '+F(dv), ans: P([mdiv(dd,dv)]), step:'途中：'+(c<0?'−':'')+fa(body(dd), body(dv))+' を約分'}; });
  var s2b4 = G(function(){ var d=ri(2,6)*rs(), k=ri(2,5)*rs(); var dd=M(d*k,'x2y2'), dv=M(d,'xy');
    return {ex: P([dd])+' ÷ '+F(dv), ans: P([mdiv(dd,dv)])}; });

  var s2c1 = G(function(){ var q=ri(2,5), p=ri(1,q-1); if(gcd(p,q)!==1) return null;
    var a=M(q*ri(1,4)*rs(),'x'), b=M([p*rs(),q],'y');
    return {ex: P([a])+' × '+F(b), ans: P([mmul(a,b)])}; });
  var s2c2 = G(function(){ var p=ri(1,8), q=ri(2,9), r=ri(1,4), s=ri(2,5);
    if(gcd(p,q)!==1 || gcd(r,s)!==1) return null;
    var a=M([p*rs(),q],'xy'), b=M([r*rs(),s],'x'), res=mdiv(a,b);
    var recip = (b.c[0]<0?'(−':'')+fa(String(s), (r===1?'':r)+dvar('x'))+(b.c[0]<0?')':'');
    return {ex: P([a])+' ÷ '+F(b), ans: P([res]), step:'途中：'+P([a])+' × '+recip+'（逆数をかける）'}; });
  var s2c3 = G(function(){ var c2=ri(2,4)*rs(), c1=c2*ri(2,4)*rs(), c3=ri(2,5)*rs();
    var a=M(c1,'x2y'), b=M(c2,'x'), c=M(c3,'y');
    return {ex: P([a])+' ÷ '+F(b)+' × '+F(c), ans: P([mmul(mdiv(a,b),c)]),
      step:'途中：'+(a.c[0]*b.c[0]*c.c[0]<0?'−':'')+fa(body(a)+' × '+body(c), body(b))}; });
  var s2c4 = G(function(){ var q=ri(2,5), p=ri(1,q-1), s=ri(2,5), r=ri(1,s-1);
    if(gcd(p,q)!==1 || gcd(r,s)!==1) return null;
    var a=M(ri(1,6)*rs(),'xy2'), b=M([p,q],'y'), c=M([-r,s],'x');
    var res=mmul(mdiv(a,b),c); if(res.c[1]===1 && Math.abs(res.c[0])===1 && Math.random()<0.7) return null;
    return {ex: P([a])+' ÷ '+F(b)+' × '+F(c), ans: P([res])}; });

  // ========== STEP 3: いろいろな式・式の値・等式の変形 ==========
  function lin(){ return [M(ri(1,6)*(Math.random()<0.85?1:-1),'x'), M(rnz(-7,7),'y')]; }
  var s3a1 = G(function(){ var k1=ri(2,5), k2=ri(2,5), A=lin(), B=lin();
    var E=scale(A,k1).concat(scale(B,k2)), R=merge(E); if(R.length<2) return null;
    return {ex: k1+PP(A)+' + '+k2+PP(B), ans: P(R), step:'途中：'+P(E)}; });
  var s3a2 = G(function(){ var k1=ri(2,5), k2=ri(2,5), A=lin(), B=lin();
    var E=scale(A,k1).concat(scale(B,-k2)), R=merge(E); if(R.length<2) return null;
    return {ex: k1+PP(A)+' − '+k2+PP(B), ans: P(R), step:'途中：'+P(E)}; });
  function fracSum(minus){ return G(function(){
    var p=ri(2,6), q=ri(2,6); if(p===q) return null;
    var L=lcm(p,q), A=lin(), B=lin();
    var N=merge(scale(A,L/p).concat(scale(B,(minus?-1:1)*L/q))); if(N.length<2) return null;
    var g=L; N.forEach(function(m){ g=gcd(g,m.c[0]); });
    var Nr=scale(N,Q(1,g)), den=L/g;
    var ans = den===1 ? P(Nr) : fa(P(Nr), den);
    var step = '途中：'+fa((L/p===1?'':L/p)+PP(A)+(minus?' − ':' + ')+(L/q===1?'':L/q)+PP(B), L);
    return {ex: fa(P(A),p)+(minus?' − ':' + ')+fa(P(B),q), ans: ans, step: step};
  }); }

        {label:'式の値　次の問いに答えなさい。', gens:[s3b1,s3b2,s3b3,s3b4]},
        {label:'等式の変形　次の等式を { } 内の文字について解きなさい。', gens:[s3c1,s3c2,s3c3,s3c4]}
      ]},
    { title:'STEP 4　連立方程式（加減法）', star:'★★★★☆☆', max:12, pts:[
        '係数の絶対値がそろっている文字を消す：符号が同じならひく、ちがうならたす',
        'そろっていないときは、式を何倍かして係数の絶対値をそろえる',
        '求めた値をもとの式に代入して、もう一方の文字の値を求める'
      ], sections:[
        {label:'そのまま加減する　次の連立方程式を解きなさい。', gens:[s4a,s4a,s4a,s4a], al:'xy'},
        {label:'一方の式を何倍かする　次の連立方程式を解きなさい。', gens:[s4b,s4b,s4b,s4b], al:'xy'},
        {label:'両方の式を何倍かする　次の連立方程式を解きなさい。', gens:[s4c,s4c,s4c,s4c], al:'xy'}
      ]},
    { title:'STEP 5　連立方程式（代入法・かっこ）', star:'★★★★★☆', max:12, pts:[
        '代入法：'+dvar('y')+' = ～（'+dvar('x')+' = ～）の式を、もう一方の式に<b>かっこをつけて</b>代入する',
        dvar('y')+' = ～ どうしなら、右辺どうしを = で結んで解く',
        'かっこがある式は、かっこをはずして整理してから解く。係数が大きい式はわって小さくする'
      ], sections:[
        {label:'代入法　次の連立方程式を解きなさい。', gens:[s5a,s5a,s5a,s5a], al:'xy'},
        {label:'代入法（同じ文字＝の形）　次の連立方程式を解きなさい。', gens:[s5b,s5b,s5b,s5b], al:'xy'},
        {label:'かっこ・大きな係数がある式　次の連立方程式を解きなさい。', gens:[s5c,s5c,s5c,s5c], al:'xy'}
      ]},
    { title:'STEP 6　連立方程式（小数・分数・A = B = C）', star:'★★★★★★', max:9, h:'29.8mm', pts:[
        '小数は10倍、分数は分母の最小公倍数を<b>すべての項</b>にかけて、係数を整数にする',
        dvar('A')+' = '+dvar('B')+' = '+dvar('C')+' の形は、{ '+dvar('A')+' = '+dvar('C')+'、'+dvar('B')+' = '+dvar('C')+' } などの連立方程式になおす',
        '解がわかっているときは、その値を代入して '+dvar('a')+'、'+dvar('b')+' の連立方程式をつくる'
      ], sections:[
        {label:'小数・大きな係数　次の連立方程式を解きなさい。', gens:[s6a1,s6a2,s6a3], al:'xy'},
        {label:'分数　次の連立方程式を解きなさい。', gens:[s6b1,s6b2,s6b3], al:'xy'},
        {label:'A = B = C の形・解から係数を求める　次の問いに答えなさい。', gens:[s6c1,s6c2,s6c3], al:'xy'}
      ]}
  ];

  function alHtml(kind){
    var b = '<span class="blank">&nbsp;</span>';
    if (kind==='xy') return dvar('x')+' = '+b+'　'+dvar('y')+' = '+b;
    if (kind==='ab') return dvar('a')+' = '+b+'　'+dvar('b')+' = '+b;
    return '答え <span class="blank w">&nbsp;</span>';
  }

  function render(){
    var out = '';
    var allAnswers = [];
    STEPS.forEach(function(step, si){
      var qNo = 1, items = [], body = '';
      step.sections.forEach(function(sec){
        body += '<div class="sec">'+sec.label+'</div>';
        sec.gens.forEach(function(gen){
          var p = gen();
          items.push({no:qNo, ex:p.ex, ans:p.ans, step:p.step, chk:p.chk});
          body += '<div class="cell"><div class="cq"><span class="no">('+qNo+')</span><span class="ex">'+p.ex+'</span></div><div class="al">'+alHtml(p.al||sec.al)+'</div></div>';
          qNo++;
        });
      });
      out += '<div class="sheet hw'+(si>0?' pb':'')+'">';
      out += '<div class="hh"><div class="hh1">CONNECT 中2数学　計算練習<span class="hno">第'+(si+1)+'枚／全6枚</span></div>';
      out += '<div class="hh2">'+step.title+'<span class="gr">むずかしさ '+step.star+'</span></div></div>';
      out += '<div class="meta"><span>名前</span><span class="ln w1">&nbsp;</span><span>日付</span><span class="ln w2">&nbsp;</span><span>かかった時間</span><span class="ln w3">&nbsp;</span><span>分</span><span>○の数</span><span class="ln w3">&nbsp;</span><span>／'+step.max+'</span></div>';
      out += '<div class="point"><b>ポイント</b><ul>'+step.pts.map(function(t){return '<li>'+t+'</li>';}).join('')+'</ul></div>';
      out += '<div class="grid" style="--h:'+(step.h||'27.8mm')+'">'+body+'</div>';
      out += '</div>';
      allAnswers.push({title: step.title, no: si+1, items: items});
    });

    out += '<div class="sheet ans pb">';
    out += '<h1>解答・解説</h1>';
    out += '<div class="sub">CONNECT 中2数学　計算練習（式の計算・連立方程式）（全6枚）</div>';
    out += '<div class="memo"><b>■ 進め方の目安</b>・1枚あたり15〜20分。STEP 1 から順に、1日1枚ずつ進めます（STEP が上がるほど、少しずつ難しくなります）。<br>・先に「ポイント」を読んでから解きます。途中の式は消さずに書いてください。<br>・答え合わせはこのページで。○をつけて、まちがえた問題は「途中」を見ながら解き直します。<br>・連立方程式は、求めた答えを2つの式の両方に代入して、成り立つか確かめましょう。</div>';
    allAnswers.forEach(function(a){
      out += '<h2>第'+a.no+'枚　'+a.title+'</h2><div class="two">';
      a.items.forEach(function(it){
        out += '<div class="ai"><span class="no">('+it.no+')</span><span class="k">'+it.ans+'</span>'+(it.step?('<span class="st">'+it.step+'</span>'):'')+'</div>';
      });
      out += '</div>';
    });
    out += '</div>';
    document.getElementById('output').innerHTML = out;
    window.__lastAnswers = allAnswers; // for checking
  }

  document.getElementById('genBtn').addEventListener('click', render);
  document.getElementById('printBtn').addEventListener('click', function(){ window.print(); });

  var editing = false;
  document.getElementById('editBtn').addEventListener('click', function(){
    editing = !editing;
    document.body.classList.toggle('editmode', editing);
    this.classList.toggle('active', editing);
    this.textContent = editing ? '編集モード：ON' : '編集モード';
    document.querySelectorAll('.sheet').forEach(function(el){ el.setAttribute('contenteditable', editing ? 'true' : 'false'); });
  });

  render();
})();
</script>

</body>
</html>
