<!DOCTYPE html>

<style>

* { box-sizing: border-box; }

.en { font-family: "Century Gothic", "Trebuchet MS", "Segoe UI", Verdana, sans-serif; }

.controlbar { position: sticky; top: 0; z-index: 10; background: #1F3A5F; color: #fff; padding: 12px 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; font-size: 13px; }

.sub { text-align:center; font-size:10.5pt; color:#444; margin-bottom:6px; }
.namebox { border:1px solid #333; padding:4px 10px; display:flex; gap:24px; justify-content:flex-end; margin: 4px 0 10px; font-size:10.5pt; }
.rules { border:1px solid #333; padding:6px 12px; font-size:9.5pt; margin-bottom:10px; line-height:1.55; }

.pts { float:right; font-size:10pt; color:#333; font-weight:normal; }

ol.items { list-style:none; padding-left:0.2em; margin:6px 0; }

.jp { font-size:10.5pt; line-height:1.45; }
.words { line-height:1.4; margin-left:1.6em; }
.words u { text-underline-offset: 2px; }
.line { border-bottom:1px solid #222; height:1.5em; margin:0 0 4px 1.6em; }

.memo { border:2px solid #222; padding:6px 12px; margin:6px 0 8px; font-size:9.5pt; line-height:1.5; }
.memo > b:first-child { display:block; margin-bottom:2px; }
.unit { break-inside:avoid; page-break-inside:avoid; border-bottom:1px dotted #999; padding:1px 0; line-height:1.38; }
.unit .top { display:flex; gap:8px; align-items:baseline; }
.unit .no { font-weight:bold; min-width:2.2em; }
.unit .jp { flex:1; }

.unit .a { margin-left:2.6em; font-size:11pt; }
.k { color:#000; font-weight:bold; text-decoration:underline; text-underline-offset:2px; }
.unit .ex { margin-left:2.6em; font-size:9pt; color:#333; line-height:1.4; }
.ex .x { display:inline-block; border:1px solid #777; padding:0 4px; margin-right:4px; font-size:8.5pt; }
.aim { border:1px solid #333; padding:6px 12px; margin-top:10px; font-size:9.5pt; line-height:1.5; break-inside:avoid; page-break-inside:avoid; }

.empty { text-align:center; color:#666; padding:40px 0; }
body.editmode [contenteditable="true"] { outline: 1px dashed #C9972B; }

@media print {

  body.print-a .sheet.qs { display:none !important; }

.backhead { display:flex; justify-content:space-between; border-bottom:1px solid #333; padding-bottom:3px; margin-bottom:8px; font-size:10.5pt; }
@media (max-width: 720px) { .sheet { padding: 8mm 5mm; } }
</style>

var GROUPS = [
  ['中2の復習', ['不定詞・動名詞','助動詞・未来','比較','接続詞']],
  ['中3', ['受け身','現在完了','It・want 人 to','分詞の後置修飾','関係代名詞','間接疑問','仮定法','make・let・help']]
];
// 文頭でも小文字にしない語
var KEEP = ['I','I\'m','Ken','Emma','Mt.','Kyoto','Japan','China','English','Pochi'];

var area = document.getElementById('area');
var catbox = document.getElementById('catbox');
var levelSel = document.getElementById('levelSel');
var countSel = document.getElementById('countSel');
var countLabel = document.getElementById('countLabel');

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function shuffle(a){ a = a.slice(); for (var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

// 項目チェックボックス
GROUPS.forEach(function(g, gi){
  var s = '<span class="grp">' + g[0] + '</span>';
  g[1].forEach(function(c){
    var n = POOL.filter(function(p){ return p[0]===c; }).length;
    s += '<label><input type="checkbox" class="cat" value="' + esc(c) + '" checked> ' + esc(c) + '<span style="opacity:.6">(' + n + ')</span></label>';
  });
  s += '<button class="mini" data-g="' + gi + '" type="button">' + g[0] + 'だけ</button>';
  catbox.insertAdjacentHTML('beforeend', s + (gi===0 ? '<span class="sep"></span>' : ''));
});
catbox.insertAdjacentHTML('beforeend', '<button class="mini" data-g="all" type="button">全部</button>');
catbox.addEventListener('click', function(e){
  var b = e.target.closest('button.mini'); if (!b) return;
  var g = b.getAttribute('data-g');
  var on = g==='all' ? null : GROUPS[+g][1];
  document.querySelectorAll('.cat').forEach(function(cb){ cb.checked = on===null || on.indexOf(cb.value)>=0; });
  updateLabel();
});
catbox.addEventListener('change', updateLabel);
function selectedCats(){ return Array.prototype.map.call(document.querySelectorAll('.cat:checked'), function(cb){ return cb.value; }); }
function updateLabel(){
  var cats = selectedCats();
  var n = POOL.filter(function(p){ return cats.indexOf(p[0])>=0; }).length;
  countLabel.textContent = '選択中：' + cats.length + '項目・' + n + '問から出題';
}

// 項目がかたよらないように、項目ごとに順番に1問ずつ取る
function pick(cats, n){
  var buckets = cats.map(function(c){ return shuffle(POOL.filter(function(p){ return p[0]===c; })); });
  buckets = shuffle(buckets);
  var out = [];
  while (out.length < n) {
    var added = false;
    for (var i=0;i<buckets.length && out.length<n;i++){
      if (buckets[i].length){ out.push(buckets[i].shift()); added = true; }
    }
    if (!added) break;
  }
  return shuffle(out);
}

function lowerFirst(chunk){
  var w = chunk.split(' ')[0];
  if (KEEP.indexOf(w)>=0) return chunk;
  return chunk.charAt(0).toLowerCase() + chunk.slice(1);
}
function sentence(chunks){
  return chunks.join(' ').replace(/ ([.?])$/,'$1');
}

function buildItem(p, std){
  var chunks = p[2].split(' / ');
  var punct = chunks[chunks.length-1];
  var body = chunks.slice(0, -1);
  var fc = p[4] ? p[4].split('>') : null;
  var shown = body.map(function(c, i){
    var t = i===0 ? lowerFirst(c) : c;
    var isFc = false;
    if (std && fc && c===fc[0]) { t = fc[1]; isFc = true; }
    return { t: t, fc: isFc };
  });
  if (std && p[3]) shown.push({ t: KEEP.indexOf(p[3])>=0 ? p[3] : p[3].charAt(0).toLowerCase() + p[3].slice(1), fc:false, extra:true });
  // 正しい順のままにならないまで混ぜる
  var mixed, tries = 0;
  do { mixed = shuffle(shown); tries++; }
  while (tries < 20 && mixed.map(function(x){return x.t;}).join('|') === shown.map(function(x){return x.t;}).join('|'));
  var words = mixed.map(function(x){ return x.fc ? '<u>' + esc(x.t) + '</u>' : esc(x.t); }).join(' / ');
  return { words: '( ' + words + ' / ' + punct + ' )', answer: sentence(chunks), fc: std ? fc : null, extra: std ? p[3] : '' };
}

function build(){
  var cats = selectedCats();
  if (!cats.length){ area.innerHTML = '<div class="sheet"><p class="empty">文法項目を1つ以上選んでください。</p></div>'; return; }
  var std = levelSel.value === 'standard';
  var n = +countSel.value;
  var items = pick(cats, n);
  n = items.length;
  var built = items.map(function(p){ return buildItem(p, std); });
  var lvName = std ? '標準' : '基礎';
  var today = new Date();
  var dstr = today.getFullYear() + '年' + (today.getMonth()+1) + '月' + today.getDate() + '日';
  var allCats = GROUPS[0][1].concat(GROUPS[1][1]);
  var rangeText = cats.length === allCats.length ? '中3の全範囲（中2の復習を含む）' : cats.join('・');

  var inst = std
    ? '次の日本文に合う英文になるように、（　）内の語（句）を並べかえなさい。<span class="hint">ただし、<b>不要な語が1つ</b>含まれています。また、<u>下線</u>の語は必要があれば正しい形に直しなさい。</span>'
    : '次の日本文に合う英文になるように、（　）内の語（句）を並べかえて、全文を書きなさい。';

  var h = '<div class="sheet qs"><h1>中学3年生 並べかえ特訓（中3総復習）</h1>';
  h += '<div class="sub">［' + lvName + '］' + n + '問' + (n > 10 ? '（表' + Math.ceil(n/2) + '問・裏' + Math.floor(n/2) + '問）' : '') + '・各1点／出題範囲：' + esc(rangeText) + '</div>';
  h += '<div class="namebox"><span style="margin-right:auto">' + dstr + '</span><span>3年　組　番</span><span>名前：＿＿＿＿＿＿＿＿＿＿</span><span>／' + n + '点</span></div>';
  h += '<div class="rules">・文の最初にくる語も小文字で示してあります。答えるときは文の最初を大文字に。' + (std ? '使わない語は×で消してから並べましょう。' : '') + '<br>・まず「だれが（主語）」「どうする／〜です（動詞）」を見つけてから、残りを並べましょう。</div>';
  h += '<div class="q"><div class="qh"><span class="num">1</span><span class="inst">' + inst + '<span class="pts">［1点×' + n + '］</span></span></div><ol class="items">';
  // 両面のときは表と裏に半分ずつ
  var front = n > 10 ? Math.ceil(n / 2) : n;
  built.forEach(function(b, i){
    if (i === front) {
      h += '</ol></div></div>';
      h += '<div class="sheet qs pb"><div class="backhead"><span>中学3年生 並べかえ特訓（中3総復習）［' + lvName + '］　裏面</span><span>名前：＿＿＿＿＿＿＿＿</span></div>';
      h += '<div class="q"><ol class="items">';
    }
    h += '<li><div class="jp">(' + (i+1) + ') ' + esc(items[i][1]) + '</div><div class="words en">' + b.words + '</div><div class="line"></div></li>';
  });
  h += '</ol></div></div>';

  // 解答・解説
  var counts = {};
  items.forEach(function(p){ counts[p[0]] = (counts[p[0]]||0) + 1; });
  var countStr = allCats.filter(function(c){ return counts[c]; }).map(function(c){ return c + ' ' + counts[c]; }).join('／');
  h += '<div class="sheet ans pb"><h1>解答・解説</h1><div class="sub">中学3年生 並べかえ特訓（中3総復習）［' + lvName + '］' + n + '問・各1点</div>';
  h += '<div class="memo"><b>■ 出題範囲メモ</b>・範囲：' + esc(rangeText) + '（項目がかたよらないようランダム出題）<br>・今回の内訳：' + esc(countStr) + '<br>・採点：語順・文頭の大文字・ピリオド／？まで正しくて1点。短縮形と開いた形（don\'t / do not）はどちらも正解。右の枠は復習する文法項目。<br>・<b>ねらい</b>：英語は「だれが → どうする → 何を → どこで → いつ」の順が基本。名詞を後ろから説明するまとまり（〜ing・過去分詞・関係代名詞）や、文の中の疑問文（疑問詞＋主語＋動詞）は、ひとまとまりで考えましょう。間違えた問題は右の枠の項目を復習し、もう一度全文を書きましょう。</div>';
  built.forEach(function(b, i){
    var p = items[i];
    var notes = '';
    if (b.extra) notes += '<span class="x">不要な語</span>' + esc(b.extra) + '　';
    if (b.fc) notes += '<span class="x">形を変える</span>' + esc(b.fc[1]) + ' → ' + esc(b.fc[0]) + '　';
    h += '<div class="unit"><div class="top"><span class="no">(' + (i+1) + ')</span><span class="jp">' + esc(p[1]) + '</span><span class="tag">' + esc(p[0]) + '</span></div>';
    h += '<div class="a en"><span class="k">' + esc(b.answer) + '</span></div>';
    h += '<div class="ex">' + notes + esc(p[5]) + '</div></div>';
  });
  h += '</div>';

  area.innerHTML = h;
  if (document.body.classList.contains('editmode')) setEditable(true);
}

// 編集モード
var editBtn = document.getElementById('editBtn');
function setEditable(on){
  document.querySelectorAll('#area .sheet').forEach(function(s){ s.setAttribute('contenteditable', on ? 'true' : 'false'); });
}
editBtn.addEventListener('click', function(){
  var on = !document.body.classList.contains('editmode');
  document.body.classList.toggle('editmode', on);
  editBtn.classList.toggle('active', on);
  editBtn.textContent = on ? '編集モード終了' : '編集モード';
  setEditable(on);
});

// 保存（今表示しているプリントをそのままHTMLで保存）
document.getElementById('saveBtn').addEventListener('click', function(){
  var css = document.querySelector('style').outerHTML;
  var body = area.innerHTML.replace(/ contenteditable="(true|false)"/g, '');
  var html = '<!DOCTYPE html>\n<html lang="ja">\n<head>\n<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n<title>中3英語_並べかえ特訓</title>\n' + css + '\n</head>\n<body>\n' + body + '\n</body>\n</html>';
  var blob = new Blob(['﻿' + html], {type:'text/html;charset=utf-8'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '中3英語_並べかえ特訓_' + (levelSel.value==='standard'?'標準':'基礎') + '.html';
  document.body.appendChild(a); a.click(); a.remove();
});
var printSel = document.getElementById('printSel');
function applyPrint(){
  document.body.classList.remove('print-q','print-a');
  if (printSel.value !== 'all') document.body.classList.add('print-' + printSel.value);
}
printSel.addEventListener('change', applyPrint);
document.getElementById('printBtn').addEventListener('click', function(){ applyPrint(); window.print(); });
document.getElementById('makeBtn').addEventListener('click', build);

updateLabel();
build();
})();
</script>
