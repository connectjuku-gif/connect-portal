<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>中野東3年_後期中間_大問別ドリル（えらぶ）</title>
<style>
* { box-sizing: border-box; }
body { margin:0; font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", "Meiryo", "Noto Sans JP", sans-serif; background:#e9e9e9; color:#111; }
.bar { position: sticky; top: 0; z-index: 10; background: #1F3A5F; color: #fff; padding: 10px 16px; }
.row1 { display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; }
.title { font-weight: bold; font-size: 15px; margin-right: auto; }
.bar button, .bar a.btn { font-family: inherit; font-size: 13px; padding: 7px 14px; border-radius: 6px; border: none; cursor: pointer; text-decoration:none; }
.primary { background: #C9972B !important; color: #fff; font-weight: bold; }
.secondary { background: #3A557A !important; color: #fff; }
.tabs { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
.tabs button { background:transparent; color:#D9E1EC; border:1px solid #5A7398 !important; border-radius:999px !important; padding:6px 16px !important; }
.tabs button.on { background:#C9972B; color:#fff; border-color:#C9972B !important; font-weight:bold; }
.units { display:grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap:6px; margin-top:10px; }
.units button { padding: 7px 8px !important; border: 1px solid #5A7398 !important; background: #29466D; color:#E6ECF4; text-align:left; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.units button.on { background:#FAF8F2; color:#1F3A5F; border-color:#FAF8F2 !important; font-weight:bold; }
.levels { display:flex; align-items:center; gap:0; margin-top:10px; font-size:13px; }
.levels .lab { margin-right:8px; color:#D9E1EC; }
.levels button { background:#29466D; color:#E6ECF4; border:1px solid #5A7398 !important; border-radius:0 !important; }
.levels button:first-of-type { border-radius:6px 0 0 6px !important; }
.levels button:last-of-type { border-radius:0 6px 6px 0 !important; }
.levels button.on { background:#FAF8F2; color:#1F3A5F; font-weight:bold; }
.note { font-size:12px; color:#D9E1EC; margin-top:8px; }
.frame { max-width: 230mm; margin: 14px auto 40px; }
iframe { width:100%; border:0; background:#fff; display:block; min-height: 80vh; box-shadow:0 1px 6px rgba(0,0,0,.15); }
@media (max-width: 480px) { .units { grid-template-columns: repeat(2, 1fr); } }
@media print { .bar { display:none; } body { background:#fff; } .frame { margin:0; max-width:none; } iframe { box-shadow:none; } }
</style>
</head>
<body>
<div class="bar">
  <div class="row1">
    <span class="title">📝 中野東3年 後期中間 大問別ドリル（本番の大問5〜11の形式）｜学習塾CONNECT</span>
    <button class="primary" id="printBtn">この教材を印刷</button>
    <a class="btn secondary" id="openBtn" href="#" target="_blank" rel="noopener">別のタブで開く</a>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="units" id="units"></div>
  <div class="levels" id="levels"></div>
  <div class="note">大問をえらぶと、下にそのドリルが表示されます。</div>
</div>
<div class="frame"><iframe id="view" title="教材"></iframe></div>
<script>
(function(){
  var D = {"groups": [{"name": "", "units": [{"name": "大問5 文法4択", "f": "g3-eng-nakanohigashi-kouki-drill5.html"}, {"name": "大問6 語形変化・不足語", "f": "g3-eng-nakanohigashi-kouki-drill6.html"}, {"name": "大問7 並べかえ不要語", "f": "g3-eng-nakanohigashi-kouki-drill7.html"}, {"name": "大問8 接続詞・言い換え", "f": "g3-eng-nakanohigashi-kouki-drill8.html"}, {"name": "大問9 ミニ読解", "f": "g3-eng-nakanohigashi-kouki-drill9.html"}, {"name": "大問10 長文読解", "f": "g3-eng-nakanohigashi-kouki-drill10.html"}, {"name": "大問11 条件英作文", "f": "g3-eng-nakanohigashi-kouki-drill11.html"}]}]};
  var g = 0, u = 0, l = 0;
  var tabs = document.getElementById('tabs'), units = document.getElementById('units'), levels = document.getElementById('levels');
  var view = document.getElementById('view'), openBtn = document.getElementById('openBtn');
  function btn(txt, on, fn){ var b = document.createElement('button'); b.type = 'button'; b.textContent = txt; b.title = txt; if (on) b.className = 'on'; b.onclick = fn; return b; }
  function file(){ var x = D.groups[g].units[u].f; return typeof x === 'string' ? x : (x[D.levels[l]] || x[Object.keys(x)[0]]); }
  function render(){
    tabs.innerHTML = ''; units.innerHTML = ''; levels.innerHTML = '';
    if (D.groups.length > 1) D.groups.forEach(function(G, i){ tabs.appendChild(btn(G.name, i === g, function(){ g = i; u = 0; go(); })); });
    else tabs.style.display = 'none';
    D.groups[g].units.forEach(function(U, i){ units.appendChild(btn(U.name, i === u, function(){ u = i; go(); })); });
    var x = D.groups[g].units[u].f;
    if (D.levels && typeof x !== 'string') {
      var s = document.createElement('span'); s.className = 'lab'; s.textContent = 'レベル'; levels.appendChild(s);
      D.levels.forEach(function(L, i){ if (x[L]) levels.appendChild(btn(L, i === l, function(){ l = i; go(); })); });
      levels.style.display = '';
    } else levels.style.display = 'none';
  }
  function fit(){ try { var d = view.contentDocument; if (d && d.body) view.style.height = (d.documentElement.scrollHeight + 20) + 'px'; } catch (e) {} }
  view.addEventListener('load', function(){ fit(); setTimeout(fit, 300); setTimeout(fit, 1200); });
  window.addEventListener('resize', fit);
  function go(nohash){
    render();
    var f = file(); if (view.getAttribute('src') !== f) view.setAttribute('src', f);
    openBtn.href = f;
    if (!nohash) { try { history.replaceState(null, '', '#g' + (g + 1) + 'u' + (u + 1) + 'l' + (l + 1)); } catch (e) {} }
  }
  document.getElementById('printBtn').onclick = function(){
    try { view.contentWindow.focus(); view.contentWindow.print(); } catch (e) { window.open(openBtn.href, '_blank'); }
  };
  var m = /#g(\d+)u(\d+)(?:l(\d+))?/.exec(location.hash);
  if (m) {
    g = Math.min(Math.max(+m[1], 1), D.groups.length) - 1;
    u = Math.min(Math.max(+m[2], 1), D.groups[g].units.length) - 1;
    if (m[3] && D.levels) l = Math.min(Math.max(+m[3], 1), D.levels.length) - 1;
  }
  go(true);
})();
</script>
</body>
</html>
