<script>
(function(){
  // ---------- helpers ----------
  function ri(min, max){ return Math.floor(Math.random()*(max-min+1))+min; }
  function rnz(min, max){ var v; do{ v = ri(min,max); }while(v===0); return v; }
  function rs(){ return Math.random()<0.5 ? -1 : 1; }
  function gcd(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){ var t=a%b; a=b; b=t; } return a||1; }
  function lcm(a,b){ return Math.abs(a*b)/gcd(a,b); }
  function signed(v){ return v<0 ? ('−'+Math.abs(v)) : String(v); }
  function dvar(v){ return '<i>'+v+'</i>'; }
  function fa(n,d){ return '<span class="fr"><span>'+n+'</span><span>'+d+'</span></span>'; }
  function vr(pool){ return pool[ri(0, pool.length-1)]; }
  // retry wrapper: generator returns null when the random values are unsuitable
  function G(f){ return function(){ for(var i=0;i<500;i++){ var r=f(); if(r) return r; } throw new Error('gen failed'); }; }

  // ---------- rational numbers [n,d] ----------
  function Q(n,d){ if(d===undefined) d=1; if(d<0){ n=-n; d=-d; } var g=gcd(n,d); return [n/g, d/g]; }
  function qa(a,b){ return Q(a[0]*b[1]+b[0]*a[1], a[1]*b[1]); }
  function qm(a,b){ return Q(a[0]*b[0], a[1]*b[1]); }
  function qd(a,b){ return Q(a[0]*b[1], a[1]*b[0]); }
  function qn(a){ return [-a[0], a[1]]; }
  function qz(a){ return a[0]===0; }
  function qStr(a){ if(a[1]===1) return signed(a[0]); return (a[0]<0?'−':'')+fa(Math.abs(a[0]), a[1]); }

  // ---------- monomials {c:[n,d], v:{x:1,...}} and polynomials (arrays) ----------
  var ORDER = 'abcmhSVxyℓ';
  function parseV(s){ var v={}, re=/([^\d])(\d*)/g, m; while((m=re.exec(s))){ v[m[1]]=(v[m[1]]||0)+(m[2]?parseInt(m[2],10):1); } return v; }
  function M(c, vs){ return {c: (typeof c==='number') ? Q(c) : Q(c[0],c[1]), v: parseV(vs||'')}; }
  function vkeys(v){ return Object.keys(v).filter(function(k){return v[k]>0;}).sort(function(a,b){ return ORDER.indexOf(a)-ORDER.indexOf(b); }); }
  function vKey(v){ return vkeys(v).map(function(k){ return k+v[k]; }).join(''); }
  function vStr(v){ return vkeys(v).map(function(k){ return dvar(k)+(v[k]>1?'<sup>'+v[k]+'</sup>':''); }).join(''); }
  function body(m){ // coefficient (absolute) + variables
    var n=Math.abs(m.c[0]), d=m.c[1], vs=vStr(m.v);
    if (vs && n===1 && d===1) return vs;
    if (d===1) return n+vs;
    return fa(n,d)+vs;
  }
  function P(list){ // polynomial to html
    var L = list.filter(function(m){ return !qz(m.c); });
    if (!L.length) return '0';
    return L.map(function(m,i){
      var neg = m.c[0]<0;
      if (i===0) return (neg?'−':'')+body(m);
      return (neg?' − ':' + ')+body(m);
    }).join('');
  }
  function F(m){ var s=P([m]); return m.c[0]<0 ? '('+s+')' : s; } // monomial as a factor
  function PP(list){ return '('+P(list)+')'; }
  function merge(list){
    var keys=[], map={};
    list.forEach(function(m){ var k=vKey(m.v); if(!(k in map)){ keys.push(k); map[k]={c:Q(0), v:m.v}; } map[k].c = qa(map[k].c, m.c); });
    return keys.map(function(k){ return map[k]; }).filter(function(m){ return !qz(m.c); });
  }
  function scale(list, k){ var kk = (typeof k==='number')?Q(k):k; return list.map(function(m){ return {c:qm(m.c,kk), v:m.v}; }); }
  function mmul(a,b){ var v={}, k; for(k in a.v) v[k]=(v[k]||0)+a.v[k]; for(k in b.v) v[k]=(v[k]||0)+b.v[k]; return {c:qm(a.c,b.c), v:v}; }
  function mdiv(a,b){ var v={}, k; for(k in a.v) v[k]=(v[k]||0)+a.v[k]; for(k in b.v) v[k]=(v[k]||0)-b.v[k]; return {c:qd(a.c,b.c), v:v}; }
  function kStr(k){ return k===1 ? '' : (k===-1 ? '−' : signed(k)); } // coefficient in front of ( )

  // ---------- polynomial helpers (中3) ----------
  function pmul(A,B){ var L=[]; A.forEach(function(a){ B.forEach(function(b){ L.push(mmul(a,b)); }); }); return merge(L); }
  function deg(m){ var d=0; for(var k in m.v) d+=m.v[k]; return d; }
  function srt(L){ return L.map(function(m,i){ return [m,i]; }).sort(function(p,q){ return deg(q[0])-deg(p[0]) || p[1]-q[1]; }).map(function(p){ return p[0]; }); }
  function SP(L){ return P(srt(merge(L))); }
  function lx(a, v){ return [M(1, v||'x'), M(a,'')]; }           // x + a
  function fx(a, v){ return a===0 ? dvar(v||'x') : PP(lx(a, v)); } // (x + a)
  function sq2(s){ return s+'<sup>2</sup>'; }
  function par(v){ return v<0 ? '('+signed(v)+')' : String(v); }

  // ---------- square roots ----------
  function sqf(n){ var k=1, r=n; for(var p=2;p*p<=r;p++){ while(r%(p*p)===0){ r/=p*p; k*=p; } } return [k,r]; }
  function rt(x){ return '<span class="rt">√<span class="rr">'+x+'</span></span>'; }
  function tq(c,r){ var n=Math.abs(c[0]), d=c[1], rad = r===1 ? '' : rt(r); var top = (r!==1 && n===1) ? rad : n+rad; return d===1 ? top : fa(top, d); }
  function SS(list){ // list of {c:Q, r:int}; merges same r, keeps first-seen order
    var keys=[], map={};
    list.forEach(function(t){ if(!(t.r in map)){ keys.push(t.r); map[t.r]=Q(0); } map[t.r]=qa(map[t.r], t.c); });
    var L = keys.map(function(r){ return {c:map[r], r:+r}; }).filter(function(t){ return !qz(t.c); });
    if (!L.length) return '0';
    return L.map(function(t,i){ var neg=t.c[0]<0; return (i===0 ? (neg?'−':'') : (neg?' − ':' + '))+tq(t.c,t.r); }).join('');
  }
  function sr(n, c){ var s=sqf(n); return {c: qm(c===undefined?Q(1):c, Q(s[0])), r:s[1]}; } // c√n simplified
  function K(k, n){ return (k<0?'−':'')+(Math.abs(k)===1?'':Math.abs(k))+rt(n); }         // k√n as written
  function pk(k, n){ return k<0 ? '('+K(k,n)+')' : K(k,n); }
  var SQF = [2,3,5,6,7,10,11];
  function pm(p, q, r, d){ // (p ± q√r)/d simplified, q>0
    var g = gcd(gcd(Math.abs(p)||d, q), d); p/=g; q/=g; d/=g;
    if (d<0){ p=-p; d=-d; }
    var s = (p===0 ? '±' : signed(p)+' ± ')+(q===1?'':q)+rt(r);
    return d===1 ? s : fa(s, d);
  }
  function xs(){ return dvar('x')+' = '+Array.prototype.slice.call(arguments).join('、'); }
  function root(D){ var s=sqf(D); return s; }

  // ========== STEP 1: 式の展開 ==========
  var s1a1 = G(function(){ var A=M(rnz(-6,6),'x'), B=[M(ri(1,5),'x'), M(rnz(-9,9),'')];
    return {ex: P([A])+PP(B), ans: SP(pmul([A],B))}; });
  var s1a2 = G(function(){ var A=M(rnz(-5,5),'a'), B=[M(ri(1,4),'a'), M(rnz(-6,6),'b')];
    return {ex: P([A])+PP(B), ans: SP(pmul([A],B))}; });
  var s1a3 = G(function(){ var k=rnz(-5,5); if(Math.abs(k)===1) return null; var mo=M(k,'x'), q=[M(rnz(-5,5),'x'), M(rnz(-6,6),'')];
    return {ex: PP(pmul(q,[mo]))+' ÷ '+F(mo), ans: P(q), step:'途中：各項を '+F(mo)+' でわる'}; });
  var s1a4 = G(function(){ var k=ri(2,4)*rs(), mo=M(k,'xy'), q=[M(rnz(-4,4),'x'), M(rnz(-5,5),'y')];
    return {ex: PP(pmul(q,[mo]))+' ÷ '+F(mo), ans: P(q)}; });

  var s1b1 = G(function(){ var a=rnz(-6,6), b=rnz(-6,6), A=lx(a), B=lx(b,'y');
    return {ex: PP(A)+PP(B), ans: P(pmul(A,B))}; });
  var s1b2 = G(function(){ var a=ri(1,4), c=ri(1,4); if(a===1 && c===1) return null;
    var A=[M(a,'x'), M(rnz(-6,6),'')], B=[M(c,'x'), M(rnz(-6,6),'')];
    return {ex: PP(A)+PP(B), ans: SP(pmul(A,B))}; });
  var s1b3 = G(function(){ var A=[M(1,'a'), M(rnz(-4,4),'b')], B=[M(ri(1,3),'a'), M(rnz(-4,4),'b')];
    var R=pmul(A,B); if(R.length<3) return null;
    return {ex: PP(A)+PP(B), ans: SP(R)}; });
  var s1b4 = G(function(){ var A=lx(rnz(-4,4)), B=[M(1,'x'), M(rnz(-3,3),'y'), M(rnz(-5,5),'')];
    var R=pmul(A,B); if(R.length<5) return null;
    return {ex: PP(A)+PP(B), ans: SP(R)}; });

  var s1c1 = G(function(){ var a=rnz(-8,8), b=rnz(-8,8); if(a===b || a===-b) return null; var R=pmul(lx(a),lx(b));
    return {ex: fx(a)+fx(b), ans: SP(R), step:'途中：'+dvar('x')+'<sup>2</sup> + {'+signed(a)+' + '+par(b)+'}'+dvar('x')+' + '+par(a)+' × '+par(b)}; });
  var s1c2 = G(function(){ var a=ri(1,9), v=vr(['x','a','y']);
    return {ex: sq2(PP(lx(a,v))), ans: SP(pmul(lx(a,v),lx(a,v))), step:'途中：'+dvar(v)+'<sup>2</sup> + 2 × '+a+' × '+dvar(v)+' + '+a+'<sup>2</sup>'}; });
  var s1c3 = G(function(){ var a=-ri(1,9), v=vr(['x','a','y']);
    return {ex: sq2(PP(lx(a,v))), ans: SP(pmul(lx(a,v),lx(a,v))), step:'途中：'+dvar(v)+'<sup>2</sup> − 2 × '+(-a)+' × '+dvar(v)+' + '+(-a)+'<sup>2</sup>'}; });
  var s1c4 = G(function(){ var a=ri(1,9), v=vr(['x','a','y']), f=Math.random()<0.5;
    return {ex: f ? PP(lx(a,v))+PP(lx(-a,v)) : PP(lx(-a,v))+PP(lx(a,v)), ans: SP(pmul(lx(a,v),lx(-a,v))), step:'途中：(和)(差) ＝ '+dvar(v)+'<sup>2</sup> − '+a+'<sup>2</sup>'}; });

  // ========== STEP 2: 因数分解 ==========
  var s2a1 = G(function(){ var g=ri(2,6), p=ri(1,4), q=rnz(-7,7); if(gcd(p,q)!==1) return null;
    var fac=M(g,'x'), inner=[M(p,'x'), M(q,'')];
    return {ex: P(pmul([fac],inner)), ans: P([fac])+PP(inner)}; });
  var s2a2 = G(function(){ var g=ri(2,6), p=ri(1,3), q=rnz(-5,5); if(gcd(p,q)!==1) return null;
    var fac=M(g,'a'), inner=[M(p,'b'), M(q,'')];
    return {ex: P(pmul([fac],inner)), ans: P([fac])+PP(inner)}; });
  var s2a3 = G(function(){ var g=ri(1,5), p=ri(1,4), q=rnz(-5,5); if(gcd(p,q)!==1) return null;
    var fac=M(g,'xy'), inner=[M(p,'x'), M(q,'y')];
    return {ex: P(pmul([fac],inner)), ans: P([fac])+PP(inner)}; });
  var s2a4 = G(function(){ var g=ri(2,5), p=ri(1,3), q=rnz(-4,4), r=rnz(-5,5); if(gcd(gcd(p,q),r)!==1) return null;
    var fac=M(g,'a'), inner=[M(p,'x'), M(q,'y'), M(r,'')];
    return {ex: P(pmul([fac],inner)), ans: P([fac])+PP(inner)}; });

  function trin(sgn){ return G(function(){ // sgn: 'pp' both +, 'mm' both −, 'pm' mixed
    var a=ri(1,9), b=ri(1,9); if(a===b) return null;
    if(sgn==='mm'){ a=-a; b=-b; } if(sgn==='pm'){ b=-b; if(a+b===0) return null; }
    if(a>b){ var t=a; a=b; b=t; }
    return {ex: SP(pmul(lx(a),lx(b))), ans: fx(a)+fx(b), step:'途中：たして '+signed(a+b)+'、かけて '+signed(a*b)+' になる2数は '+signed(a)+' と '+signed(b)};
  }); }
  var s2b1=trin('pp'), s2b2=trin('mm'), s2b3=trin('pm'), s2b4=trin('pm');

  var s2c1 = G(function(){ var a=ri(1,10);
    return {ex: SP(pmul(lx(a),lx(a))), ans: sq2(fx(a)), step:'途中：'+dvar('x')+'<sup>2</sup> + 2 × '+a+' × '+dvar('x')+' + '+a+'<sup>2</sup>'}; });
  var s2c2 = G(function(){ var a=-ri(1,10);
    return {ex: SP(pmul(lx(a),lx(a))), ans: sq2(fx(a)), step:'途中：'+dvar('x')+'<sup>2</sup> − 2 × '+(-a)+' × '+dvar('x')+' + '+(-a)+'<sup>2</sup>'}; });
  var s2c3 = G(function(){ var a=ri(1,12), v=vr(['x','a','y']);
    return {ex: SP(pmul(lx(a,v),lx(-a,v))), ans: fx(a,v)+fx(-a,v), step:'途中：'+dvar(v)+'<sup>2</sup> − '+a+'<sup>2</sup>'}; });

        dvar('x')+'<sup>2</sup> + ●'+dvar('x')+' + ▲ は「たして●、かけて▲」になる2数をさがす',
        '平方の形 '+dvar('x')+'<sup>2</sup> ± 2'+dvar('a')+dvar('x')+' + '+dvar('a')+'<sup>2</sup> ＝ ('+dvar('x')+' ± '+dvar('a')+')<sup>2</sup>、'+dvar('x')+'<sup>2</sup> − '+dvar('a')+'<sup>2</sup> ＝ ('+dvar('x')+' + '+dvar('a')+')('+dvar('x')+' − '+dvar('a')+')'
      ], sections:[
        {label:'共通因数をくくり出す　次の式を因数分解しなさい。', gens:[s2a1,s2a2,s2a3,s2a4]},
        {label:'たして・かけての公式　次の式を因数分解しなさい。', gens:[s2b1,s2b2,s2b3,s2b4]},
        {label:'平方・和と差の公式　次の式を因数分解しなさい。', gens:[s2c1,s2c2,s2c3,s2c4]}
      ]},
    { title:'STEP 3　展開・因数分解の応用', star:'★★★☆☆☆', max:12, pts:[
        '係数があるときも公式は同じ：(3'+dvar('x')+' − 2)<sup>2</sup> ＝ 9'+dvar('x')+'<sup>2</sup> − 12'+dvar('x')+' + 4',
        '因数分解は「共通因数 → 公式」の順。くくったあと、かっこの中がさらに分解できないか確かめる',
        '同じまとまりは '+dvar('A')+' とおきかえる。展開できる式は、展開して整理してから因数分解する'
      ], sections:[
        {label:'いろいろな式の展開　次の計算をしなさい。', gens:[s3a1,s3a2,s3a3,s3a4]},
        {label:'共通因数＋公式・係数のある公式　次の式を因数分解しなさい。', gens:[s3b1,s3b2,s3b3,s3b4]},
        {label:'おきかえ・整理してから　次の式を因数分解しなさい。', gens:[s3c1,s3c2,s3c3,s3c4]}
      ]},
    { title:'STEP 4　平方根（簡単にする・乗除・有理化）', star:'★★★★☆☆', max:12, pts:[
        rt('の中')+' はできるだけ小さい自然数に：'+rt(12)+' ＝ '+rt('4 × 3')+' ＝ 2'+rt(3),
        rt(dvar('a'))+' × '+rt(dvar('b'))+' ＝ '+rt(dvar('a')+dvar('b'))+'、'+rt(dvar('a'))+' ÷ '+rt(dvar('b'))+' ＝ '+rt(fa(dvar('a'),dvar('b'))),
        '分母の有理化：分母と分子に同じ '+rt('●')+' をかけて、分母に √ がない形にする'
      ], sections:[
        {label:'平方根を簡単にする・変形する　次の問いに答えなさい。', gens:[s4a1,s4a2,s4a3,s4a4]},
        {label:'平方根の乗法・除法　次の計算をしなさい。', gens:[s4b1,s4b2,s4b3,s4b4]},
        {label:'分母の有理化　次の数の分母を有理化しなさい。', gens:[s4c1,s4c2,s4c3,s4c4]}
      ]},
    { title:'STEP 5　平方根の加減・展開・式の値', star:'★★★★★☆', max:12, pts:[
        '√ の中が同じ数どうしだけ、たしたりひいたりできる（'+rt(2)+' + '+rt(3)+' はこれ以上まとまらない）',
        '√ をふくむ式の展開も、分配法則・乗法公式を使う。('+rt(dvar('a'))+')<sup>2</sup> ＝ '+dvar('a'),
        '式の値は、因数分解してから代入すると計算がラクになる'
      ], sections:[
        {label:'平方根の加法・減法　次の計算をしなさい。', gens:[s5a1,s5a2,s5a3,s5a4]},
        {label:'平方根をふくむ式の展開　次の計算をしなさい。', gens:[s5b1,s5b2,s5b3,s5b4]},
        {label:'式の値・平方根の性質　次の問いに答えなさい。', gens:[s5c1,s5c2,s5c3,s5c4]}
      ]},
    { title:'STEP 6　二次方程式', star:'★★★★★★', max:12, pts:[
        dvar('x')+'<sup>2</sup> ＝ '+dvar('a')+' なら '+dvar('x')+' ＝ ±'+rt(dvar('a'))+'。(〇)<sup>2</sup> ＝ ● の形は、かっこの中を1つの文字とみて解く',
        '因数分解できるときは、'+dvar('A')+dvar('B')+' ＝ 0 なら '+dvar('A')+' ＝ 0 または '+dvar('B')+' ＝ 0',
        '解の公式：'+dvar('a')+dvar('x')+'<sup>2</sup> + '+dvar('b')+dvar('x')+' + '+dvar('c')+' ＝ 0 の解は '+dvar('x')+' ＝ '+fa('−'+dvar('b')+' ± '+rt(dvar('b')+'<sup>2</sup> − 4'+dvar('a')+dvar('c')), '2'+dvar('a'))
      ], sections:[
        {label:'平方根の考えで解く　次の二次方程式を解きなさい。', gens:[s6a1,s6a2,s6a3,s6a4], al:'x'},
        {label:'因数分解で解く　次の二次方程式を解きなさい。', gens:[s6b1,s6b2,s6b3,s6b4], al:'x'},
        {label:'解の公式で解く　次の二次方程式を解きなさい。', gens:[s6c1,s6c2,s6c3,s6c4], al:'x'}
      ]}
  ];

  function alHtml(kind){
    var b = '<span class="blank">&nbsp;</span>';
    if (kind==='xy') return dvar('x')+' = '+b+'　'+dvar('y')+' = '+b;
    if (kind==='ab') return dvar('a')+' = '+b+'　'+dvar('b')+' = '+b;
    if (kind==='x') return dvar('x')+' = <span class="blank w">&nbsp;</span>';
    return '答え <span class="blank w">&nbsp;</span>';
  }

  function renderSteps(){
    var out = '';
    var allAnswers = [];
    STEPS.forEach(function(step, si){
      var qNo = 1, items = [], body = '';
      step.sections.forEach(function(sec){
        body += '<div class="sec">'+sec.label+'</div>';
        sec.gens.forEach(function(gen){
          var p = gen();
          items.push({no:qNo, ex:p.ex, ans:p.ans, step:p.step, chk:p.chk});
          body += '<div class="cell"><div class="cq"><span class="no">('+qNo+')</span><span class="ex">'+p.ex+'</span></div><div class="al">'+alHtml(p.al||sec.al)+'</div></div>';
          qNo++;
        });
      });
      out += '<div class="sheet hw'+(si>0?' pb':'')+'">';
      out += '<div class="hh"><div class="hh1">CONNECT 中3数学　計算練習<span class="hno">第'+(si+1)+'枚／全6枚</span></div>';
      out += '<div class="hh2">'+step.title+'<span class="gr">むずかしさ '+step.star+'</span></div></div>';
      out += '<div class="meta"><span>名前</span><span class="ln w1">&nbsp;</span><span>日付</span><span class="ln w2">&nbsp;</span><span>かかった時間</span><span class="ln w3">&nbsp;</span><span>分</span><span>○の数</span><span class="ln w3">&nbsp;</span><span>／'+step.max+'</span></div>';
      out += '<div class="point"><b>ポイント</b><ul>'+step.pts.map(function(t){return '<li>'+t+'</li>';}).join('')+'</ul></div>';
      out += '<div class="grid" style="--h:'+(step.h||'27.8mm')+'">'+body+'</div>';
      out += '</div>';
      allAnswers.push({title: step.title, no: si+1, items: items});
    });

    out += '<div class="sheet ans pb">';
    out += '<h1>解答・解説</h1>';
    out += '<div class="sub">CONNECT 中3数学　計算練習（展開・因数分解・平方根・二次方程式）（全6枚）</div>';
    out += '<div class="memo"><b>■ 進め方の目安</b>・1枚あたり15〜20分。STEP 1 から順に、1日1枚ずつ進めます（STEP が上がるほど、少しずつ難しくなります）。<br>・先に「ポイント」を読んでから解きます。途中の式は消さずに書いてください。<br>・答え合わせはこのページで。○をつけて、まちがえた問題は「途中」を見ながら解き直します。<br>・因数分解は、答えを展開してもとの式にもどるか確かめましょう。二次方程式は、解をもとの式に代入して確かめられます。</div>';
    allAnswers.forEach(function(a){
      out += '<h2>第'+a.no+'枚　'+a.title+'</h2><div class="two">';
      a.items.forEach(function(it){
        out += '<div class="ai"><span class="no">('+it.no+')</span><span class="k">'+it.ans+'</span>'+(it.step?('<span class="st">'+it.step+'</span>'):'')+'</div>';
      });
      out += '</div>';
    });
    out += '</div>';
    document.getElementById('output').innerHTML = out;
    window.__lastAnswers = allAnswers; // for checking
  }

  var CFG = { grade:'中3', mixH:'34mm', stepInfo:'STEP1〜6　計72問（各STEP 12問）',
    al: function(sec,p){ return alHtml(p.al||sec.al); },
    tag: function(sec,p){ if (p.al==='ab') return '問いに答える'; if (sec.al==='x') return '二次方程式を解く'; if (sec.label.indexOf('等式')>=0) return '{ } 内の文字について解く'; if (sec.label.indexOf('式の値')>=0) return '式の値・計算'; return '計算'; } };
  // ========== MIX（総合）: 各STEPから2問ずつ、1枚12問 ==========
  function shuf(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
  function renderMix(n){
    var out = '', allAnswers = [];
    for (var s=0; s<n; s++){
      var cells = '', items = [], qNo = 1;
      STEPS.forEach(function(step){
        var idx = shuf(step.sections.map(function(_,i){ return i; })).slice(0,2).sort();
        idx.forEach(function(k){
          var sec = step.sections[k], gen = sec.gens[Math.floor(Math.random()*sec.gens.length)], p = gen();
          items.push({no:qNo, ex:p.ex, ans:p.ans, step:p.step, chk:p.chk});
          cells += '<div class="cell"><div class="cq"><span class="no">('+qNo+')</span><span class="ex">'+p.ex+'</span></div><div class="al">'+CFG.al(sec,p)+'</div></div>';
          qNo++;
        });
      });
      out += '<div class="sheet hw'+(s>0?' pb':'')+'">';
      out += '<div class="hh"><div class="hh1">CONNECT '+CFG.grade+'数学　計算練習（MIX）<span class="hno">第'+(s+1)+'枚／全'+n+'枚</span></div>';
      out += '<div class="hh2">MIX　STEP 1〜6 総合<span class="gr">むずかしさ ★〜★★★★★★（後ろほど難しい）</span></div></div>';
      out += '<div class="meta"><span>名前</span><span class="ln w1">&nbsp;</span><span>日付</span><span class="ln w2">&nbsp;</span><span>かかった時間</span><span class="ln w3">&nbsp;</span><span>分</span><span>○の数</span><span class="ln w3">&nbsp;</span><span>／12</span></div>';
      out += '<div class="point"><b>やり方</b><ul><li>STEP 1〜6 の問題が2問ずつ、やさしい順に並んでいます。計算は答えを、方程式は解を求めましょう。</li><li>途中の式は消さずに書きます。まちがえた問題は、そのSTEPのプリントで練習し直しましょう。</li></ul></div>';
      out += '<div class="grid" style="--h:'+CFG.mixH+'">'+cells+'</div>';
      out += '</div>';
      allAnswers.push({title:'MIX（総合）', no:s+1, items:items});
    }
    out += '<div class="sheet ans pb">';
    out += '<h1>解答・解説</h1>';
    out += '<div class="sub">CONNECT '+CFG.grade+'数学　計算練習 MIX（全'+n+'枚）</div>';
    out += '<div class="memo"><b>■ MIXの使い方</b>・1枚に STEP 1〜6 から2問ずつ（(1)(2)がSTEP 1、(11)(12)がSTEP 6）。<br>・まちがえた問題の番号から、どのSTEPが苦手かがわかります。そのSTEPのプリントで練習し直しましょう。</div>';
    allAnswers.forEach(function(a){
      out += '<h2>第'+a.no+'枚　'+a.title+'</h2><div class="two">';
      a.items.forEach(function(it){
        out += '<div class="ai"><span class="no">('+it.no+')</span><span class="k">'+it.ans+'</span>'+(it.step?('<span class="st">'+it.step+'</span>'):'')+'</div>';
      });
      out += '</div>';
    });
    out += '</div>';
    document.getElementById('output').innerHTML = out;
    window.__lastAnswers = allAnswers;
  }

  var modeSel = document.getElementById('modeSel'), countSel = document.getElementById('countSel'), countWrap = document.getElementById('countWrap');
  function render(){
    var mix = modeSel.value === 'mix';
    countWrap.style.display = mix ? '' : 'none';
    if (mix){
      var n = parseInt(countSel.value, 10);
      renderMix(n);
      document.getElementById('rangeInfo').textContent = 'MIX　'+n+'枚　計'+(n*12)+'問（各STEPから2問ずつ×'+n+'枚）';
    } else {
      renderSteps();
      document.getElementById('rangeInfo').textContent = CFG.stepInfo;
    }
    // 係数の 1 は書かない（1x → x、−1x → −x）
    var o = document.getElementById('output');
    o.innerHTML = o.innerHTML.replace(/(^|[^\d.])1<i>/g, '$1<i>').replace(/ [+−] 0(?![.\d])/g, '');
  }
  modeSel.addEventListener('change', render);
  countSel.addEventListener('change', render);

  document.getElementById('genBtn').addEventListener('click', render);
  document.getElementById('printBtn').addEventListener('click', function(){ window.print(); });

  var editing = false;
  document.getElementById('editBtn').addEventListener('click', function(){
    editing = !editing;
    document.body.classList.toggle('editmode', editing);
    this.classList.toggle('active', editing);
    this.textContent = editing ? '編集モード：ON' : '編集モード';
    document.querySelectorAll('.sheet').forEach(function(el){ el.setAttribute('contenteditable', editing ? 'true' : 'false'); });
  });

  // ポータルのカードから ?mode=mix（&n=枚数）で開いたときは MIX で表示
  try {
    var qp = new URLSearchParams(location.search);
    if (qp.get('mode') === 'mix') { modeSel.value = 'mix'; if (['1','2','4','6'].indexOf(qp.get('n')) >= 0) countSel.value = qp.get('n'); }
  } catch(e) {}
  render();
})();
</script>

</body>
</html>
