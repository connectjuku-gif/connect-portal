<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>思考力トレーニング_ぬけたアルファベットさがし（ランダム）</title>
<style>
@page { size: A4; margin: 14mm 14mm; }
* { box-sizing: border-box; }
body { font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", "Meiryo", "Noto Sans JP", sans-serif; color:#111; line-height:1.6; font-size:11.5pt; margin:0; background:#e9e9e9; }
.sheet { background:#fff; max-width: 190mm; margin: 12px auto; padding: 12mm 12mm; box-shadow: 0 1px 6px rgba(0,0,0,.15); }
@media print { body{background:#fff;} .sheet{ box-shadow:none; margin:0; padding:0; max-width:none; } .nop{display:none !important;} .pb{ page-break-before: always; break-before: page; } }

/* ---- 操作バー ---- */
.controlbar { position: sticky; top: 0; z-index: 10; background: #1F3A5F; color: #fff; padding: 12px 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; font-size: 13px; }
.controlbar .title { font-weight: bold; font-size: 15px; margin-right: 8px; }
.controlbar button { font-family: inherit; font-size: 13px; padding: 7px 14px; border-radius: 6px; border: none; cursor: pointer; }
.controlbar button.primary { background: #C9972B; color: #fff; font-weight: bold; }
.controlbar button.secondary { background: #3A557A; color: #fff; }
.controlbar button.secondary.active { background: #8A2E2E; }
.controlbar select { font-family:inherit; font-size:13px; padding:6px 8px; border-radius:6px; border:none; }
.controlbar label { display:inline-flex; align-items:center; gap:6px; }
.controlbar .spacer { flex: 1; }
.controlbar .count { font-size: 12px; color: #D9E1EC; }
body.editmode [contenteditable="true"] { outline: 1px dashed #C9972B; }
@media print { [contenteditable] { outline: none !important; } }

/* ---- 問題用紙 ---- */
.hh { border-bottom:2px solid #222; padding-bottom:3px; margin-bottom:6px; }
.hh1 { font-size:10.5pt; color:#333; letter-spacing:.05em; display:flex; justify-content:space-between; }
.hh2 { font-size:15pt; font-weight:bold; margin-top:1px; }
.meta { display:flex; align-items:flex-end; justify-content:flex-end; gap:6px; font-size:10.5pt; margin:4px 0 6px; }
.meta .ln { display:inline-block; border-bottom:1px solid #222; }
.meta .w1 { min-width:42mm; } .meta .w3 { min-width:12mm; }
.point { border:1px solid #222; padding:5px 10px; font-size:10pt; line-height:1.6; margin-bottom:3mm; }
.point .ex { font-family: "Century Gothic", "Arial", sans-serif; font-size:11pt; letter-spacing:.25em; }
.abc { font-family: "Century Gothic", "Arial", sans-serif; font-size:11pt; letter-spacing:.32em; text-align:center; border:1px dashed #777; border-radius:4px; padding:3px 0; margin-bottom:3mm; }
.list .row { display:flex; align-items:center; border-bottom:1px dotted #888; height: var(--h); }
.row .no { font-size:11pt; font-weight:bold; width:3em; flex-shrink:0; }
.row .ltr { flex:1; font-family: "Century Gothic", "Arial", sans-serif; font-size: var(--fs); letter-spacing:.45em; }
.row .ak { font-size:10.5pt; display:flex; align-items:center; gap:6px; }
.row .ak span { display:inline-block; width:15mm; height:min(12mm, calc(var(--h) - 2.5mm)); border:1.5px solid #333; border-radius:3px; }
.blankpage { text-align:center; color:#aaa; font-size:10px; padding-top:120mm; height:250mm; }
.ans h1 { text-align:center; font-size:16pt; margin:0 0 4px; }
.ans .sub { text-align:center; font-size:10.5pt; color:#444; margin-bottom:8px; }
.ans h2 { font-size:12pt; border-left:5px solid #222; padding-left:8px; margin:10px 0 4px; break-after:avoid; }
.agrid { display:grid; grid-template-columns: 1fr 1fr; gap: 0 10mm; break-inside:avoid; }
.ai { font-size:10.5pt; padding:2px 0; border-bottom:1px dotted #bbb; display:flex; gap:6px; align-items:baseline; }
.ai .no { width:2.6em; font-weight:bold; font-size:9.5pt; }
.ai .seq { font-family: "Century Gothic", "Arial", sans-serif; letter-spacing:.2em; color:#333; }
.k { font-weight:bold; text-decoration: underline; font-size:12pt; }
.memo { border:2px solid #222; padding:8px 12px; font-size:10pt; margin:8px 0; }
.memo b { display:block; margin-bottom:2px; }
</style>
</head>
<body>

<div class="controlbar nop">
  <span class="title">🔤 ぬけたアルファベットさがし｜学習塾CONNECT</span>
  <label>文字の数 <select id="lenSel"><option value="4">やさしい（4文字）</option><option value="6">ふつう（6文字）</option><option value="8" selected>むずかしい（8文字）</option><option value="10">チャレンジ（10文字）</option></select></label>
  <label>文字 <select id="caseSel"><option value="lower">小文字</option><option value="upper">大文字</option></select></label>
  <label>ヒント <select id="hintSel"><option value="on">ABC表をのせる</option><option value="off">のせない</option></select></label>
  <label>問題数 <select id="numSel"><option value="10">1枚10問</option><option value="15">1枚15問</option><option value="20" selected>1枚20問</option></select></label>
  <label>枚数 <select id="countSel"><option value="1" selected>1枚</option><option value="2">2枚</option><option value="3">3枚</option><option value="4">4枚</option><option value="5">5枚</option><option value="6">6枚</option></select></label>
  <button class="primary" id="genBtn">問題を作り直す</button>
  <button class="secondary" id="editBtn">編集モード</button>
  <button class="secondary" id="printBtn">印刷</button>
  <span class="spacer"></span>
  <span class="count" id="info"></span>
</div>

<div id="output"></div>

<script>
(function(){
  var AB = 'abcdefghijklmnopqrstuvwxyz';
  function ri(a, b){ return Math.floor(Math.random() * (b - a + 1)) + a; }
  function shuffle(a){ for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  // ならんだ文字（L＋1文字）から、まん中のどれか1文字をぬいて、のこりをばらばらにする
  function make(L){
    var st = ri(0, 26 - (L + 1)), run = AB.substr(st, L + 1).split('');
    var miss = ri(1, L - 1);                       // 最初と最後の文字はぬかない（どこまでの範囲か分かるように）
    var m = run[miss], rest = run.filter(function(_, i){ return i !== miss; }), sh;
    for (var t = 0; t < 50; t++) {                  // となり同士がアルファベット順に3つ以上つづかないようにまぜる
      sh = shuffle(rest.slice()); var run3 = 0, bad = false;
      for (var i = 1; i < sh.length; i++) { run3 = (sh[i].charCodeAt(0) - sh[i - 1].charCodeAt(0) === 1) ? run3 + 1 : 0; if (run3 >= 2) bad = true; }
      if (!bad && sh.join('') !== rest.join('')) break;
    }
    return { q: sh, a: m, seq: run, miss: miss };
  }
  var sheets = [], CASE = 'lower';
  function cs(s){ return CASE === 'upper' ? s.toUpperCase() : s; }
  function sheetHtml(list, k, n){
    var per = list.length, h = Math.min(18, Math.floor((document.getElementById('hintSel').value === 'on' ? 202 : 212) / per));
    var x = '<div class="sheet' + (k ? ' pb' : '') + '" style="--h:' + h + 'mm;--fs:' + (per > 15 ? 17 : 20) + 'pt"><div class="hh"><div class="hh1"><span>思考力トレーニング</span><span>' + (n > 1 ? (k + 1) + '／' + n + '枚目' : '') + '</span></div>'
      + '<div class="hh2">ぬけたアルファベットさがし</div></div>'
      + '<div class="meta"><span>名前</span><span class="ln w1"></span><span>　月　日</span><span>　</span><span class="ln w3"></span><span>／' + per + '問</span></div>'
      + '<div class="point">つづいているアルファベットを、ばらばらにならべかえました。そのうち<b>1文字だけ</b>がぬけています。ぬけている文字を□に書きましょう。'
      + '<br>れい）<span class="ex">' + cs('d b e a') + '</span>　→　a b ★ d e なので　答えは <b>' + cs('c') + '</b></div>';
    if (document.getElementById('hintSel').value === 'on') x += '<div class="abc">' + cs(AB).split('').join(' ') + '</div>';
    x += '<div class="list">';
    list.forEach(function(p, i){
      x += '<div class="row"><span class="no">(' + (i + 1) + ')</span><span class="ltr">' + cs(p.q.join('')) + '</span><span class="ak">答え<span></span></span></div>';
    });
    return x + '</div></div>';
  }
  function answerHtml(){
    var h = '<div class="sheet ans pb"><h1>解答</h1><div class="sub">ぬけたアルファベットさがし（' + sheets.length + '枚）</div>';
    sheets.forEach(function(list, k){
      if (sheets.length > 1) h += '<h2>' + (k + 1) + '枚目</h2>';
      h += '<div class="agrid">';
      list.forEach(function(p, i){
        var seq = p.seq.map(function(c, j){ return j === p.miss ? '（' + cs(c) + '）' : cs(c); }).join(' ');
        h += '<div class="ai"><span class="no">(' + (i + 1) + ')</span><span class="k">' + cs(p.a) + '</span><span class="seq">' + seq + '</span></div>';
      });
      h += '</div>';
    });
    return h + '<div class="memo"><b>■ とき方のポイント</b>・まず、いちばん前の文字（ABC順でいちばん早い文字）と、いちばん後ろの文字をさがそう。<br>'
      + '・その間の文字を、ABCの順に1つずつ「あるかな？」とたしかめていくと、ぬけている文字が見つかる。<br>・見つけた文字にしるしをつけながら進めると、見おとしがへるよ。</div></div>';
  }
  function render(){
    CASE = document.getElementById('caseSel').value;
    var L = +document.getElementById('lenSel').value, per = +document.getElementById('numSel').value, n = +document.getElementById('countSel').value;
    sheets = [];
    for (var k = 0; k < n; k++) { var list = [], seen = {}; while (list.length < per) { var p = make(L); if (seen[p.q.join('')]) continue; seen[p.q.join('')] = 1; list.push(p); } sheets.push(list); }
    var h = sheets.map(function(l, k){ return sheetHtml(l, k, n); }).join('');
    // 両面印刷用：問題が3枚以上の奇数枚なら白紙を1枚はさみ、解答を新しい紙の表から始める
    if (n > 1 && n % 2 === 1) h += '<div class="sheet pb blankpage">（両面印刷用の白紙ページ）</div>';
    document.getElementById('output').innerHTML = h + answerHtml();
    document.getElementById('info').textContent = '1問' + L + '文字・' + per + '問 × ' + n + '枚＋解答';
    if (document.body.classList.contains('editmode')) setEdit(true);
  }
  function setEdit(on){
    document.body.classList.toggle('editmode', on);
    var b = document.getElementById('editBtn'); b.classList.toggle('active', on); b.textContent = on ? '編集モード：ON' : '編集モード';
    Array.prototype.forEach.call(document.querySelectorAll('#output .sheet'), function(s){ s.contentEditable = on ? 'true' : 'false'; });
  }
  ['lenSel','caseSel','hintSel','numSel','countSel'].forEach(function(id){ document.getElementById(id).addEventListener('change', render); });
  document.getElementById('genBtn').addEventListener('click', render);
  document.getElementById('editBtn').addEventListener('click', function(){ setEdit(!document.body.classList.contains('editmode')); });
  document.getElementById('printBtn').addEventListener('click', function(){ window.print(); });
  window.__make = make;
  render();
})();
</script>
</body>
</html>
