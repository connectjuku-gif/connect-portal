  var NUM = '一二三四五六七八九十';

  function parse(row){
    var t = row[1], m = t.match(/\[([^\]]+)\]/), f = m[1].split('|');
    return { set: row[0], pre: t.slice(0, m.index), post: t.slice(m.index + m[0].length),
             k: f[0], r: f[1], ok: f[2] || '', note: f[3] || '' };
  }
  var ITEMS = DATA.map(parse);
  function ruby(s){ return s.replace(/\{([^|}]+)\|([^}]+)\}/g, '<ruby>$1<rt>$2</rt></ruby>'); }
  function note(p, kind){ var r = ''; p.note.split(';').forEach(function(x){ if (x.charAt(0) === kind) r = x.slice(2); }); return r; }
  function qHtml(p, kind){
    var mid = kind === 'r' ? '<span class="t">' + p.k + '</span>' + p.ok : '<span class="t">' + p.r + p.ok + '</span>';
    var n = note(p, kind);
    return ruby(p.pre) + mid + ruby(p.post) + (n ? '<br><span class="nt">（' + n + '）</span>' : '');
  }
  function aText(p, kind){ return kind === 'r' ? p.r : p.k + p.ok; }
  function shuffle(a){ for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

  var sheets = [], setLabel = '';
  function sheetHtml(s, k, n){
    var h = '<div class="sheet' + (k ? ' pb' : '') + '"><div class="hh"><div><div class="hh1">漢検5級　漢字テスト（' + setLabel + '）' + (n > 1 ? '　' + (k + 1) + '／' + n + '枚目' : '') + '</div>'
      + '<div class="hh2">漢字の読み・書き</div></div>'
      + '<div class="meta"><span>　月　日</span><span>名前</span><span class="ln"></span><span class="sc"></span><span>／20</span></div></div>';
    [['r', '一　次の――線の漢字の読みを、ひらがなで書きなさい。', ''], ['w', '二　次の――線のひらがなを、漢字に直しなさい。', '<small>（送りがなが必要なものは、送りがなも書くこと）</small>']].forEach(function(b){
      var list = b[0] === 'r' ? s.r : s.w;
      h += '<div class="band"><div class="bh">' + b[1] + b[2] + '</div><div class="cols">';
      list.forEach(function(p, i){
        h += '<div class="col"><div class="no">' + NUM.charAt(i) + '</div><div class="v">' + qHtml(p, b[0]) + '</div><div class="box"></div></div>';
      });
      h += '</div></div>';
    });
    return h + '</div>';
  }
  function answerHtml(){
    var h = '<div class="sheet ans pb"><h1>解答</h1><div class="sub">漢検5級　漢字テスト（' + setLabel + '）　' + sheets.length + '枚</div>';
    sheets.forEach(function(s, k){
      if (sheets.length > 1) h += '<h2>' + (k + 1) + '枚目</h2>';
      [['r', '一 読み'], ['w', '二 書き']].forEach(function(b){
        h += '<div class="agrid"><div class="lab">' + b[1] + '</div>';
        (b[0] === 'r' ? s.r : s.w).forEach(function(p, i){ h += '<div><span class="n">' + NUM.charAt(i) + '</span><span class="k">' + aText(p, b[0]) + '</span></div>'; });
        h += '</div>';
      });
    });
    return h + '<div class="memo"><b>■ 範囲と勉強のポイント</b>漢検5級の問題集（その1〜その2）の文から、読み・書きを10問ずつ毎回ランダムに出しています。1枚の中で、同じ文が読みと書きの両方に出ることはありません。<br>'
      + '・読みは、音読み・訓読みのどちらで読むか、前後の言葉から考えよう。<br>・書きは、送りがなまで正しく書けて正解。まちがえた漢字は、ノートに3回ずつ書いて覚え直そう。</div></div>';
  }
  function render(){
    var sets = Array.prototype.filter.call(document.querySelectorAll('.setck'), function(c){ return c.checked; }).map(function(c){ return +c.value; });
    var info = document.getElementById('info');
    if (!sets.length) { info.textContent = '範囲を1つ以上えらんでください'; return; }
    setLabel = sets.map(function(v){ return 'その' + v; }).join('・');
    var pool = ITEMS.filter(function(p){ return sets.indexOf(p.set) >= 0; });
    var n = +document.getElementById('countSel').value, bag = [];
    sheets = [];
    for (var k = 0; k < n; k++) {
      var used = {}, pick = [];
      while (pick.length < 20) {          // できるだけ前の枚と重ならないように、使い切るまで順に取り出す
        if (!bag.length) bag = shuffle(pool.slice());
        var p = bag.pop();
        if (used[p.pre + p.k]) continue;
        used[p.pre + p.k] = 1; pick.push(p);
      }
      sheets.push({ r: pick.slice(0, 10), w: pick.slice(10) });
    }
    var h = sheets.map(function(s, k){ return sheetHtml(s, k, n); }).join('');
    // 両面印刷用：問題が3枚以上の奇数枚なら白紙を1枚はさみ、解答を新しい紙の表から始める
    if (n > 1 && n % 2 === 1) h += '<div class="sheet pb blankpage">（両面印刷用の白紙ページ）</div>';
    document.getElementById('output').innerHTML = h + answerHtml();
    info.textContent = '範囲：' + setLabel + '（' + pool.length + '文）／問題 ' + n + '枚＋解答';
    if (document.body.classList.contains('editmode')) setEdit(true);
  }
  function setEdit(on){
    document.body.classList.toggle('editmode', on);
    var b = document.getElementById('editBtn'); b.classList.toggle('active', on); b.textContent = on ? '編集モード：ON' : '編集モード';
    Array.prototype.forEach.call(document.querySelectorAll('#output .sheet'), function(s){ s.contentEditable = on ? 'true' : 'false'; });
  }
  document.getElementById('genBtn').addEventListener('click', render);
  document.getElementById('countSel').addEventListener('change', render);
  Array.prototype.forEach.call(document.querySelectorAll('.setck'), function(c){ c.addEventListener('change', render); });
  document.getElementById('editBtn').addEventListener('click', function(){ setEdit(!document.body.classList.contains('editmode')); });
  document.getElementById('printBtn').addEventListener('click', function(){ window.print(); });
  window.__ITEMS = ITEMS;
  render();
})();
